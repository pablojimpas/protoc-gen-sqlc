name: Go

on:
  push:
    branches:
      - master
    paths:
      - "**.go"
      - "**/*.tmpl"
      - "**/*.proto"
      - "**/*.sql"
      - "**/buf*.yaml"
      - "buf.lock"
      - "**/sqlc.yaml"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/**"
      - "Makefile"
  pull_request:
    branches:
      - master
    paths:
      - "**.go"
      - "**/*.tmpl"
      - "**/*.proto"
      - "**/*.sql"
      - "**/buf*.yaml"
      - "buf.lock"
      - "**/sqlc.yaml"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/**"
      - "Makefile"

permissions: {}

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26', '1.27' ]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          check-latest: true
          cache-dependency-path: "go.sum"
      - name: Lint
        run: make audit
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Run
        run: make sqlc
